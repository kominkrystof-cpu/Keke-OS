set timeout=5
set default=0

# Keke OS Boot Configuration
menuentry "Keke OS v2.8.0" {
    search --label keke-os --set root
    insmod vbe
    insmod gfxterm
    set gfxmode=1024x768x32
    set gfxpayload=keep
    terminal_output gfxterm
    linux /boot/vmlinuz root=/dev/sda6 ro console=ttyS0 console=tty0 loglevel=3
    initrd /boot/keke-initramfs.cpio.gz
}

menuentry "Keke OS - Debug Mode" {
    search --label keke-os --set root
    linux /boot/vmlinuz root=/dev/sda6 ro earlyprintk=serial,ttyS0,115200 debug ignore_loglevel console=ttyS0 console=tty0 loglevel=1
    initrd /boot/keke-initramfs.cpio.gz
}
