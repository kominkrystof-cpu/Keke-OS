set timeout=5
set default=0

# Keke OS Boot Configuration
menuentry "Keke OS v2.7.5 - Stable Build 2026" {
    set root=(hd0,msdos1)
    insmod vbe
    insmod gfxterm
    set gfxmode=1024x768x32
    set gfxpayload=keep
    terminal_output gfxterm
    linux /boot/vmlinuz root=/dev/sda1 ro console=ttyS0 console=tty0 loglevel=3
    initrd /boot/keke-initramfs.cpio.gz
}

menuentry "Keke OS - Safe Mode (No Framebuffer)" {
    set root=(hd0,msdos1)
    linux /boot/vmlinuz root=/dev/sda1 ro nomodeset text console=ttyS0 loglevel=3
    initrd /boot/keke-initramfs.cpio.gz
}

menuentry "Keke OS - Debug Mode" {
    set root=(hd0,msdos1)
    linux /boot/vmlinuz root=/dev/sda1 ro earlyprintk=serial,ttyS0,115200 debug ignore_loglevel console=ttyS0 console=tty0 loglevel=1
    initrd /boot/keke-initramfs.cpio.gz
}
